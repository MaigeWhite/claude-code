version: '3.9'
services:
  backend:
    image: node:20-alpine
    working_dir: /app/backend
    volumes:
      - ./:/app
    command: sh -lc "npm install && npm start"
    environment:
      - PORT=8080
      - DATABASE_URL=postgres://agentkit:agentkit@postgres:5432/agentkit
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET=agentkit-files
    expose:
      - "8080"
    depends_on:
      - postgres
      - minio
    networks:
      - agentkit-net

  frontend:
    image: nginx:1.27-alpine
    depends_on:
      - backend
    ports:
      - "8081:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - agentkit-net

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=agentkit
      - POSTGRES_USER=agentkit
      - POSTGRES_PASSWORD=agentkit
    volumes:
      - postgres-data:/var/lib/postgresql/data
    expose:
      - "5432"
    networks:
      - agentkit-net

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - agentkit-net

volumes:
  postgres-data:
  minio-data:

networks:
  agentkit-net:
    driver: bridge
